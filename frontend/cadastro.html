<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimbastic Esports - Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Chakra Petch"', 'sans-serif'],
                        bebas: ['"Bebas Neue"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-1: #081019;
            --bg-2: #132737;
            --card: rgba(10, 20, 32, 0.7);
            --border: rgba(255, 255, 255, 0.14);
        }
        body {
            background: radial-gradient(1100px 600px at 12% -8%, #1c3f58 0%, transparent 60%),
                        radial-gradient(900px 500px at 90% 110%, #114b5f 0%, transparent 60%),
                        linear-gradient(140deg, var(--bg-1), var(--bg-2));
            color: #f4f7fb;
            min-height: 100vh;
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-[440px] z-10">
        <main class="panel p-8 sm:p-10 text-center">
            <div class="font-bebas text-5xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 font-bold mb-1">
                PIMBASTIC ESPORTS
            </div>
            <p class="text-gray-400 text-sm mb-6 uppercase tracking-wider">Crie sua Conta</p>

            <!-- Container de Erro e Sucesso -->
            <div id="error-alert" class="hidden mb-6 text-left"></div>
            <div id="success-alert" class="hidden mb-6 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 p-3 rounded-lg text-sm text-left"></div>

            <form id="registerForm" class="space-y-5 text-left">
                <div>
                    <label for="nome" class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-1.5">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Seu nome" class="w-full bg-black/40 border border-white/10 focus:border-cyan-400 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none transition-colors">
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-1.5">E-mail</label>
                    <input type="email" id="email" required placeholder="ex: usuario@email.com" class="w-full bg-black/40 border border-white/10 focus:border-cyan-400 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none transition-colors">
                </div>
                
                <div>
                    <label for="senha" class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-1.5">Senha</label>
                    <input type="password" id="senha" required placeholder="Mínimo 6 caracteres" class="w-full bg-black/40 border border-white/10 focus:border-cyan-400 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none transition-colors">
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-gray-950 font-bold uppercase tracking-wider py-3.5 rounded-xl transition-all duration-200">
                    Cadastrar
                </button>
            </form>

            <p class="mt-8 text-sm text-gray-400">
                Já tem conta? 
                <a href="/login.html" class="text-cyan-400 hover:text-emerald-400 font-semibold transition-colors">Faça Login</a>
            </p>
        </main>
    </div>

    <script type="module">
        import { apiFetch, showError, hideError } from './js/api.js';
        import { requireGuest } from './js/auth.js';

        requireGuest();

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError('error-alert');
            document.getElementById('success-alert').classList.add('hidden');
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-submit');

            try {
                btn.textContent = 'Aguarde...';
                btn.disabled = true;

                const res = await apiFetch('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ nome, email, senha })
                });

                if (res && res.message) {
                    const successDiv = document.getElementById('success-alert');
                    successDiv.innerHTML = res.message + ' <a href="/login.html" class="underline font-bold ml-2">Ir para Login</a>';
                    successDiv.classList.remove('hidden');
                    document.getElementById('registerForm').reset();
                }
            } catch (error) {
                showError('error-alert', error);
            } finally {
                btn.textContent = 'Cadastrar';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
