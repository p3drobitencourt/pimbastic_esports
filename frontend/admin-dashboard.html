<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimbastic Esports - Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Chakra Petch"', 'sans-serif'],
                        bebas: ['"Bebas Neue"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-1: #081019;
            --bg-2: #132737;
            --card: rgba(10, 20, 32, 0.7);
            --border: rgba(255, 255, 255, 0.14);
        }
        body {
            background: linear-gradient(140deg, var(--bg-1), var(--bg-2));
            color: #f4f7fb;
            min-height: 100vh;
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="font-sans flex flex-col md:flex-row min-h-screen">

    <!-- Sidebar Admin -->
    <aside class="w-full md:w-64 bg-black/60 border-r border-white/10 p-6 flex flex-col justify-between">
        <div>
            <div class="font-bebas text-3xl text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 font-bold mb-8">
                PIMBASTIC ADMIN
            </div>
            <div id="display-user-name" class="text-sm font-bold text-cyan-400 mb-1">...</div>
            <div id="display-user-role" class="text-xs text-gray-500 uppercase mb-8">...</div>

            <nav class="space-y-2">
                <a href="admin-dashboard.html" class="block px-3 py-2 rounded-lg bg-emerald-500/20 text-emerald-400 font-semibold">Dashboard</a>
                <a href="campeonatos.html" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-gray-400 transition-colors">Campeonatos</a>
                <a href="times.html" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-gray-400 transition-colors">Times</a>
                <a href="jogos.html" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-gray-400 transition-colors">Jogos</a>
                <a href="liquidacao.html" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-gray-400 transition-colors">Liquidação</a>
            </nav>
        </div>
        <button id="btn-logout" class="mt-8 bg-red-500/20 hover:bg-red-500/30 text-red-400 px-4 py-2 rounded-lg text-sm font-semibold transition-colors w-full">Sair do Sistema</button>
    </aside>

    <main class="flex-grow p-6 md:p-8">
        <h1 class="text-2xl font-bold mb-6">Métricas Gerais</h1>
        
        <div id="error-alert" class="hidden mb-6"></div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="panel p-6 text-center">
                <div class="text-xs text-gray-400 uppercase tracking-wider mb-2">Total de Campeonatos</div>
                <div id="metric-campeonatos" class="text-3xl font-bebas text-cyan-400 font-bold">0</div>
            </div>
            <div class="panel p-6 text-center">
                <div class="text-xs text-gray-400 uppercase tracking-wider mb-2">Total de Times</div>
                <div id="metric-times" class="text-3xl font-bebas text-cyan-400 font-bold">0</div>
            </div>
            <div class="panel p-6 text-center">
                <div class="text-xs text-gray-400 uppercase tracking-wider mb-2">Total de Jogos</div>
                <div id="metric-jogos" class="text-3xl font-bebas text-cyan-400 font-bold">0</div>
            </div>
            <div class="panel p-6 text-center">
                <div class="text-xs text-gray-400 uppercase tracking-wider mb-2">Apostas Registradas</div>
                <div id="metric-apostas" class="text-3xl font-bebas text-emerald-400 font-bold">0</div>
            </div>
        </div>

        <div class="panel p-6">
            <h2 class="text-lg font-bold mb-4">Jogos Recentes Cadastrados</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-white/10 text-gray-400 uppercase tracking-wider">
                            <th class="pb-3">Data/Hora</th>
                            <th class="pb-3">Campeonato</th>
                            <th class="pb-3">Time 1 vs Time 2</th>
                            <th class="pb-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="jogos-body">
                        <tr><td colspan="4" class="py-4 text-center text-gray-500">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { apiFetch, showError } from './js/api.js';
        import { requireAuth } from './js/auth.js';

        // Requer perfil 'admin'
        requireAuth('admin');

        async function carregarMeticas() {
            try {
                const res = await apiFetch('/admin/dashboard');
                const dados = res.data;
                
                document.getElementById('metric-campeonatos').textContent = dados.metricas.campeonatos_total || 0;
                document.getElementById('metric-times').textContent = dados.metricas.times_total || 0;
                document.getElementById('metric-jogos').textContent = dados.metricas.jogos_total || 0;
                // Como não tem métrica específica de apostas na API original do dashboard, mantemos 0 ou liquidacoes pendentes
                document.getElementById('metric-apostas').textContent = dados.metricas.liquidacoes_pendentes || 0;
                
            } catch (error) {
                showError('error-alert', error);
            }
        }

        async function carregarJogosRecentes() {
            try {
                const res = await apiFetch('/admin/jogos-recentes');
                const jogos = res.data;
                const tbody = document.getElementById('jogos-body');
                
                if (!jogos || jogos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-gray-500">Nenhum jogo cadastrado.</td></tr>';
                    return;
                }

                tbody.innerHTML = jogos.slice(0, 10).map(jogo => `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                        <td class="py-3 px-2">${new Date(jogo.data_horario).toLocaleString('pt-BR')}</td>
                        <td class="py-3 px-2 font-semibold text-cyan-300">${jogo.campeonato || `Camp #${jogo.campeonato_id}`}</td>
                        <td class="py-3 px-2">${jogo.casa || `Time #${jogo.time_casa_id}`} <span class="text-gray-500 text-xs mx-1">vs</span> ${jogo.fora || `Time #${jogo.time_fora_id}`}</td>
                        <td class="py-3 px-2">
                            <span class="px-2 py-1 rounded text-xs uppercase ${jogo.status === 'finalizado' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-yellow-500/20 text-yellow-400'}">
                                ${jogo.status}
                            </span>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                // Exibe erro no console sem bloquear as métricas
                console.error(error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarMeticas();
            carregarJogosRecentes();
        });
    </script>
</body>
</html>
