<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimbastic Esports - Times</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Chakra Petch"', 'sans-serif'],
                        bebas: ['"Bebas Neue"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-1: #081019;
            --bg-2: #132737;
            --card: rgba(10, 20, 32, 0.7);
            --border: rgba(255, 255, 255, 0.14);
        }
        body {
            background: linear-gradient(140deg, var(--bg-1), var(--bg-2));
            color: #f4f7fb;
            min-height: 100vh;
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="font-sans flex flex-col md:flex-row min-h-screen">

    <!-- Sidebar Admin -->
    <aside class="w-full md:w-64 bg-black/60 border-r border-white/10 p-6 flex flex-col justify-between">
        <div>
            <div class="font-bebas text-3xl text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 font-bold mb-8">
                PIMBASTIC ADMIN
            </div>
            <div id="display-user-name" class="text-sm font-bold text-cyan-400 mb-1">...</div>
            <div id="display-user-role" class="text-xs text-gray-500 uppercase mb-8">...</div>

            <nav class="space-y-2">
                <a href="admin-dashboard.html" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-gray-400 transition-colors">Dashboard</a>
                <a href="campeonatos.html" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-gray-400 transition-colors">Campeonatos</a>
                <a href="times.html" class="block px-3 py-2 rounded-lg bg-emerald-500/20 text-emerald-400 font-semibold">Times</a>
                <a href="jogos.html" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-gray-400 transition-colors">Jogos</a>
                <a href="liquidacao.html" class="block px-3 py-2 rounded-lg hover:bg-white/5 text-gray-400 transition-colors">Liquidação</a>
            </nav>
        </div>
        <button id="btn-logout" class="mt-8 bg-red-500/20 hover:bg-red-500/30 text-red-400 px-4 py-2 rounded-lg text-sm font-semibold transition-colors w-full">Sair do Sistema</button>
    </aside>

    <main class="flex-grow p-6 md:p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bebas text-cyan-400">Gerenciar Times</h1>
            <button class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-4 rounded shadow-lg transition-colors" onclick="abrirModal()">
                + Novo Time
            </button>
        </div>
        
        <div id="error-alert" class="hidden mb-6"></div>

        <div class="panel p-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-white/10 text-gray-400 uppercase tracking-wider">
                            <th class="pb-3 px-2">ID</th>
                            <th class="pb-3 px-2">Nome do Time</th>
                            <th class="pb-3 px-2 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="3" class="py-4 text-center text-gray-500">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal de Cadastro/Edição -->
        <div id="crud-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden backdrop-blur-sm">
            <div class="bg-gray-900 border border-white/10 rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <h2 id="modal-title" class="text-2xl font-bebas text-cyan-400 mb-4">Novo Time</h2>
                
                <div id="modal-error-alert" class="hidden mb-4 bg-red-500/15 border border-red-500/35 text-red-300 p-3 rounded-lg text-sm"></div>

                <form id="crud-form" onsubmit="event.preventDefault(); salvarTime();">
                    <input type="hidden" id="time-id">
                    
                    <div class="mb-4">
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wide mb-2" for="time-nome">Nome do Time</label>
                        <input class="w-full bg-black/50 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" 
                            id="time-nome" type="text" placeholder="Ex: LOUD" required>
                    </div>

                    <div class="mb-4">
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wide mb-2" for="time-tecnico">Técnico</label>
                        <input class="w-full bg-black/50 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" 
                            id="time-tecnico" type="text" placeholder="Ex: fRoD" required>
                    </div>

                    <div class="flex justify-end space-x-3 mt-6">
                        <button type="button" onclick="fecharModal()" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors font-semibold">Cancelar</button>
                        <button type="submit" id="btn-save" class="px-4 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white font-bold transition-colors shadow-lg">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { apiFetch, showError, hideError } from './js/api.js';
        import { requireAuth } from './js/auth.js';

        requireAuth('admin');

        async function carregarLista() {
            try {
                const res = await apiFetch('/admin/times');
                const itens = res.data || res; 
                const list = Array.isArray(itens) ? itens : itens.data;
                const tbody = document.getElementById('table-body');
                
                if (!list || list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-gray-500">Nenhum registro encontrado.</td></tr>';
                    return;
                }

                tbody.innerHTML = list.map(item => `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                        <td class="py-3 px-2 text-gray-400">#${item.id}</td>
                        <td class="py-3 px-2 font-semibold text-cyan-300">${item.nome}</td>
                        <td class="py-3 px-2 text-right">
                            <button class="text-emerald-400 hover:text-emerald-300 text-xs uppercase px-2" onclick="abrirModal(${item.id}, '${item.nome.replace(/'/g, "\\'")}', '${(item.tecnico || '').replace(/'/g, "\\'")}')">Editar</button>
                            <button class="text-red-400 hover:text-red-300 text-xs uppercase px-2" onclick="excluirTime(${item.id})">Excluir</button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                showError('error-alert', error);
                document.getElementById('table-body').innerHTML = '<tr><td colspan="3" class="py-4 text-center text-red-500">Erro ao carregar dados.</td></tr>';
            }
        }

        // --- Funções CRUD ---
        window.abrirModal = function(id = null, nome = '', tecnico = '') {
            hideError('modal-error-alert');
            document.getElementById('time-id').value = id || '';
            document.getElementById('time-nome').value = nome;
            document.getElementById('time-tecnico').value = tecnico;
            document.getElementById('modal-title').textContent = id ? 'Editar Time' : 'Novo Time';
            document.getElementById('crud-modal').classList.remove('hidden');
        };

        window.fecharModal = function() {
            document.getElementById('crud-modal').classList.add('hidden');
        };

        window.salvarTime = async function() {
            const id = document.getElementById('time-id').value;
            const nome = document.getElementById('time-nome').value.trim();
            const tecnico = document.getElementById('time-tecnico').value.trim();
            const btn = document.getElementById('btn-save');

            if (!nome || !tecnico) return;

            try {
                btn.textContent = 'Salvando...';
                btn.disabled = true;

                const endpoint = id ? `/admin/times/${id}` : '/admin/times';
                const method = id ? 'PUT' : 'POST';

                await apiFetch(endpoint, {
                    method: method,
                    body: JSON.stringify({ nome, tecnico })
                });

                fecharModal();
                carregarLista(); // Atualiza a lista
            } catch (error) {
                showError('modal-error-alert', error);
            } finally {
                btn.textContent = 'Salvar';
                btn.disabled = false;
            }
        };

        window.excluirTime = async function(id) {
            if (!confirm('Tem certeza que deseja excluir este time? Esta ação não pode ser desfeita.')) return;

            try {
                await apiFetch(`/admin/times/${id}`, { method: 'DELETE' });
                carregarLista(); // Atualiza a lista
            } catch (error) {
                showError('error-alert', error);
            }
        };

        carregarLista();
    </script>
</body>
</html>
